<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="cyber-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22d3ee" />
      <stop offset="50%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#8b5cf6" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <polygon points="50,5 90,27.5 90,72.5 50,95 10,72.5 10,27.5" fill="#070b14" stroke="url(#cyber-grad)" stroke-width="3" filter="url(#glow)"/>
  <circle cx="50" cy="50" r="30" fill="none" stroke="#22d3ee" stroke-width="1.5" stroke-dasharray="4 2" opacity="0.6"/>
  <text x="50" y="62" font-family="'Plus Jakarta Sans', 'Space Grotesk', 'Segoe UI', sans-serif" font-size="38" font-weight="900" fill="url(#cyber-grad)" text-anchor="middle" letter-spacing="1">A</text>
</svg>
