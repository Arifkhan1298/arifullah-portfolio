<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 700" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070b14" />
      <stop offset="50%" stop-color="#0d1322" />
      <stop offset="100%" stop-color="#111827" />
    </linearGradient>
    <linearGradient id="neon-cyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#22d3ee" />
      <stop offset="100%" stop-color="#8b5cf6" />
    </linearGradient>
    <linearGradient id="violet-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#6366f1" />
    </linearGradient>
    <radialGradient id="hologram-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="0.25" />
      <stop offset="70%" stop-color="#8b5cf6" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#070b14" stop-opacity="0" />
    </radialGradient>
    <filter id="soft-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <rect width="600" height="700" fill="url(#bg-grad)" rx="24"/>
  <rect width="600" height="700" fill="url(#hologram-glow)" rx="24"/>

  <g opacity="0.12" stroke="#22d3ee" stroke-width="1">
    <line x1="100" y1="0" x2="100" y2="700"/>
    <line x1="200" y1="0" x2="200" y2="700"/>
    <line x1="300" y1="0" x2="300" y2="700"/>
    <line x1="400" y1="0" x2="400" y2="700"/>
    <line x1="500" y1="0" x2="500" y2="700"/>
    <line x1="0" y1="150" x2="600" y2="150"/>
    <line x1="0" y1="300" x2="600" y2="300"/>
    <line x1="0" y1="450" x2="600" y2="450"/>
    <line x1="0" y1="600" x2="600" y2="600"/>
  </g>

  <circle cx="300" cy="310" r="190" fill="none" stroke="url(#neon-cyan)" stroke-width="1.5" stroke-dasharray="12 6" opacity="0.4"/>
  <circle cx="300" cy="310" r="215" fill="none" stroke="url(#violet-grad)" stroke-width="2" stroke-dasharray="24 16" opacity="0.5" filter="url(#soft-glow)"/>
  <circle cx="300" cy="310" r="150" fill="none" stroke="#22d3ee" stroke-width="1" stroke-dasharray="6 4" opacity="0.25"/>

  <g id="avatar" opacity="0.95">
    <circle cx="300" cy="270" r="110" fill="#111827" stroke="url(#neon-cyan)" stroke-width="2.5" filter="url(#soft-glow)"/>
    <circle cx="300" cy="235" r="58" fill="#1e293b"/>
    <path d="M 245 225 Q 300 165 355 225 Q 350 200 300 185 Q 250 200 245 225 Z" fill="#111827"/>
    <path d="M 180 380 C 180 310 220 290 270 285 L 330 285 C 380 290 420 310 420 380 Z" fill="#1e293b"/>
    <polygon points="300,320 280,285 320,285" fill="#334155"/>
    <polygon points="300,350 290,305 310,305" fill="url(#violet-grad)"/>
  </g>

  <g transform="translate(100, 500)">
    <rect width="400" height="130" rx="16" fill="#070b14" fill-opacity="0.85" stroke="url(#neon-cyan)" stroke-width="1.5" filter="url(#soft-glow)"/>
    <text x="200" y="45" font-family="'Plus Jakarta Sans', 'Inter', 'Segoe UI', Roboto, sans-serif" font-size="24" font-weight="800" fill="#f8fafc" text-anchor="middle" letter-spacing="2">ARIFULLAH</text>
    <text x="200" y="75" font-family="'Plus Jakarta Sans', 'Inter', 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="600" fill="#22d3ee" text-anchor="middle" letter-spacing="1">SOFTWARE ENGINEER</text>
  </g>
</svg>
